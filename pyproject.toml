[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "0.1.0"
description = "Migration workspace for a hybrid PDF to Markdown converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pip-licenses>=5,<6",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
anydoc = [
    "firecrawl-anydoc>=0.2.4,<0.3",
    "pypdf>=6.21,<7",
    "reportlab>=4,<6",
]
kelpie = [
    "httpx>=0.28,<1",
    "openai>=1.109,<2",
    "pypdfium2>=5.14,<6",
]

[project.scripts]
doc2md = "doc2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "anydoc: tests requiring the optional local AnyDoc binding",
    "kelpie: tests requiring the approved Kelpie service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
follow_imports = "normal"
ignore_missing_imports = true
